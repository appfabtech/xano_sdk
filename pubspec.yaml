name: xano_sdk
description: >
  Flutter port of the Xano JS SDK — realtime WebSocket channels only.
  Supports public/private channels, presence, message history, offline
  message queuing, and automatic reconnection with exponential back-off.
version: 0.1.0
homepage: https://xano.com

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
